version: "3.9"

name: ecomm-data-engg-setup
volumes:
  minio_data:
    name: ecomm-data-storage-minio

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin1!
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    profiles: [ "init" ]
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin1!
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set ecomm-data-pipeline http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing ecomm-data-pipeline/raw;
      /usr/bin/mc mb --ignore-existing ecomm-data-pipeline/cleansed;
      /usr/bin/mc mb --ignore-existing ecomm-data-pipeline/processed;
      echo 'placeholder' | /usr/bin/mc pipe ecomm-data-pipeline/raw/bronze/.keep;
      echo 'placeholder' | /usr/bin/mc pipe ecomm-data-pipeline/cleansed/silver/.keep;
      echo 'placeholder' | /usr/bin/mc pipe ecomm-data-pipeline/processed/bronze/.keep;
      echo 'placeholder' | /usr/bin/mc pipe ecomm-data-pipeline/processed/silver/.keep;
      echo 'MinIO buckets and prefixes created.';
      "